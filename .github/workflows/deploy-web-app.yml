# Build Flutter web app and deploy website/ + app/ to GitHub Pages.
# Live: https://kiu.orion13.us/  and  https://kiu.orion13.us/app/

name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'website/**'
      - '.github/workflows/deploy-web-app.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'UPANEL_API_BASE_URL baked into the web build'
        required: false
        default: 'http://169.58.135.136'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web app
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'http://169.58.135.136' }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=UPANEL_API_BASE_URL="$API_URL" \
            --base-href=/app/
          bash scripts/finalize-web-build.sh

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          # Landing page, downloads, legal pages
          rsync -a --exclude 'app' website/ _site/
          # Flutter web app at /app/
          rsync -a build/web/ _site/app/
          touch _site/.nojekyll _site/app/.nojekyll
          test -f _site/index.html
          test -f _site/app/index.html
          echo "Site layout:"
          ls -la _site
          ls -la _site/app | head

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
