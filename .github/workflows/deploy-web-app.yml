# Build Flutter web app and deploy website/ + app/ to GitHub Pages (gh-pages branch).
# Live: https://kiu.orion13.us/  and  https://kiu.orion13.us/app/
#
# One-time repo setup: Settings → Pages → Build and deployment → Deploy from branch
# → Branch: gh-pages / (root). Custom domain: kiu.orion13.us

name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'website/**'
      - 'scripts/finalize-web-build.sh'
      - 'config/nginx/Dockerfile'
      - '.github/workflows/deploy-web-app.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'UPANEL_API_BASE_URL baked into the web build'
        required: false
        default: 'http://169.58.135.136'

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web app
        env:
          API_URL: ${{ github.event.inputs.api_base_url || 'http://169.58.135.136' }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=UPANEL_API_BASE_URL="$API_URL" \
            --dart-define=APP_BUILD_NUMBER="$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\\+([0-9]+).*/\\1/')" \
            --dart-define=APP_VERSION_LABEL="$(grep -E '^version:' pubspec.yaml | sed -E 's/version: ([0-9.]+).*/\\1/')" \
            --base-href=/app/
          bash scripts/finalize-web-build.sh

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          # Landing page, downloads, legal pages
          rsync -a --exclude 'app' website/ _site/
          # Flutter web app at /app/
          rsync -a build/web/ _site/app/
          touch _site/.nojekyll _site/app/.nojekyll
          test -f _site/index.html
          test -f _site/app/index.html
          echo "Site layout:"
          ls -la _site
          ls -la _site/app | head

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

      - name: Remind — sync Contabo server
        run: |
          echo "::notice::gh-pages updated. Production at https://kiu.orion13.us/app/ updates only after:"
          echo "  ssh root@169.58.135.136 -p 443"
          echo "  cd /opt/upanel && bash scripts/contabo/deploy-web-on-server.sh"
          echo "Or add secret CONTABO_SSH_PRIVATE_KEY to enable workflow 'Sync web to Contabo server'."
