# Nginx gateway for U-Panel API (Kamal accessory, host network).
# Proxies to Gunicorn on 127.0.0.1:8000 (web role publish binding).

upstream upanel_web {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 169.58.135.136 api.kiu.orion13.us api.orion13.us _;

    client_max_body_size 25m;

    location / {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /api/health/ {
        proxy_pass http://upanel_web;
        access_log off;
    }
}

# HTTPS: mount certs via the nginx accessory `directories` entry in config/deploy.yml,
# then add a second server block (or replace the HTTP block with redirect + TLS).
# Example paths on the server: /var/lib/upanel/nginx/ssl/fullchain.pem and privkey.pem
