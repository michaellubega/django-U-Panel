# Nginx for docker-compose.test.yml (/opt/test on host :8080).
# Public hostname: test.orion13.us (Cloudflare Flexible → origin :80 proxy in prod nginx).

resolver 127.0.0.11 valid=10s ipv6=off;

upstream upanel_test_web {
    zone upanel_test_web 64k;
    server web:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name test.orion13.us 169.58.135.136 _;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript application/wasm application/json text/css text/plain image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /.well-known/assetlinks.json {
        alias /var/www/upanel-app/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    location = /app/index.html {
        alias /var/www/upanel-app/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/main.dart.js {
        alias /var/www/upanel-app/main.dart.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/flutter_bootstrap.js {
        alias /var/www/upanel-app/flutter_bootstrap.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/flutter_service_worker.js {
        alias /var/www/upanel-app/flutter_service_worker.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/version.json {
        alias /var/www/upanel-app/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }

    location ^~ /app/ {
        alias /var/www/upanel-app/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location = /app {
        return 301 /app/;
    }

    location = /download {
        return 301 /download/;
    }
    location ^~ /download/ {
        alias /var/www/upanel-site/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location ^~ /downloads/ {
        alias /var/www/upanel-downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /privacy {
        return 301 /privacy.html;
    }
    location = /delete-account {
        return 301 /delete-account.html;
    }
    location = /privacy.html {
        alias /var/www/upanel-site/privacy.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /delete-account.html {
        alias /var/www/upanel-site/delete-account.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }

    location ^~ /canvaskit/ {
        alias /var/www/upanel-app/canvaskit/;
        add_header Cache-Control "public, max-age=86400";
    }

    location = / {
        return 302 /app/;
    }

    location ^~ /api/ {
        proxy_pass http://upanel_test_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location ^~ /admin/ {
        proxy_pass http://upanel_test_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location / {
        proxy_pass http://upanel_test_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
