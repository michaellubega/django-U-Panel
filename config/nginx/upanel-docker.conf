# Nginx for docker-compose.prod.yml
# TLS terminates at Cloudflare (Flexible SSL → origin port 80).
# Do not bind host :443 here — SSH uses that port on the Contabo VPS.

upstream upanel_web {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.orion13.us 169.58.135.136 _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Flutter web app (baked into this image from website/app/).
    location ^~ /app/ {
        alias /var/www/upanel-app/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location = /app {
        return 301 /app/;
    }

    # Legacy/cached boot paths that omit /app/ prefix (compat shim).
    location ^~ /canvaskit/ {
        alias /var/www/upanel-app/canvaskit/;
        add_header Cache-Control "public, max-age=86400";
    }

    location = / {
        return 302 /app/;
    }

    location ^~ /api/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location ^~ /admin/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
