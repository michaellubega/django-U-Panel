# Nginx for docker-compose.prod.yml

upstream upanel_web {
    server web:8000;
    keepalive 32;
}

# HTTP — redirect to HTTPS when certs exist; serve directly until then.
server {
    listen 80;
    listen [::]:80;
    server_name api.orion13.us 169.58.135.136 _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Uncomment after HTTPS certs are installed:
        # return 301 https://$host$request_uri;
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /api/health/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}

# HTTPS — active after certbot (see scripts/contabo/setup-https.sh)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.orion13.us;

    ssl_certificate /etc/letsencrypt/live/api.orion13.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orion13.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location = /api/health/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
}
