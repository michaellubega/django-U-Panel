# Nginx for docker-compose.prod.yml
# TLS terminates at Cloudflare (Flexible SSL → origin port 80).
# Do not bind host :443 here — SSH uses that port on the Contabo VPS.

# Docker embedded DNS — re-resolve `web` after container recreate (avoids 502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream upanel_web {
    zone upanel_web 64k;
    server web:8000 resolve;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name kiu.orion13.us api.kiu.orion13.us api.orion13.us 169.58.135.136 _;

    client_max_body_size 25m;

    # Compress Flutter boot assets (~11MB raw → ~3MB over the wire).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/javascript application/wasm application/json text/css text/plain image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Android App Links — must be at domain root (not only under /app/).
    location = /.well-known/assetlinks.json {
        alias /var/www/upanel-app/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # Flutter app shell — never cache at Cloudflare edge (CF was serving stale
    # main.dart.js for up to 4h after deploy). CDN-Cache-Control targets CF only.
    location = /app/index.html {
        alias /var/www/upanel-app/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/main.dart.js {
        alias /var/www/upanel-app/main.dart.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/flutter_bootstrap.js {
        alias /var/www/upanel-app/flutter_bootstrap.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/flutter_service_worker.js {
        alias /var/www/upanel-app/flutter_service_worker.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }
    location = /app/version.json {
        alias /var/www/upanel-app/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header CDN-Cache-Control "no-store";
    }

    # Flutter web app (baked into this image from website/app/).
    location ^~ /app/ {
        alias /var/www/upanel-app/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location = /app {
        return 301 /app/;
    }

    # Download landing page and release binaries (website/).
    location = /download {
        return 301 /download/;
    }
    location ^~ /download/ {
        alias /var/www/upanel-site/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }
    location ^~ /downloads/ {
        alias /var/www/upanel-downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Legal pages at domain root (Play Store / in-app links).
    location = /privacy {
        return 301 /privacy.html;
    }
    location = /delete-account {
        return 301 /delete-account.html;
    }
    location = /privacy.html {
        alias /var/www/upanel-site/privacy.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /delete-account.html {
        alias /var/www/upanel-site/delete-account.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Legacy/cached boot paths that omit /app/ prefix (compat shim).
    location ^~ /canvaskit/ {
        alias /var/www/upanel-app/canvaskit/;
        add_header Cache-Control "public, max-age=86400";
    }

    location = / {
        return 302 /download/;
    }

    location ^~ /api/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location ^~ /admin/ {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location / {
        proxy_pass http://upanel_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
