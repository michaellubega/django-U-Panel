# Kamal deployment for U-Panel Django API
# Docs: https://kamal-deploy.org
#
# Before first deploy:
#   1. Copy .kamal/secrets.example → .kamal/secrets and set env vars (see docs/DEPLOYMENT.md)
#   2. Replace YOUR_SERVER_IP below
#   3. kamal accessory boot db redis nginx
#   4. kamal setup && kamal deploy

service: upanel
image: ovirion/upanel

servers:
  web:
    hosts:
      - 169.58.135.136
    proxy: false
    options:
      publish:
        - "127.0.0.1:8000:8000"
  worker:
    hosts:
      - 169.58.135.136
    cmd: celery -A upanel worker -l info
    proxy: false
  beat:
    hosts:
      - 169.58.135.136
    cmd: celery -A upanel beat -l info
    proxy: false

registry:
  username: ovirion
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  context: backend
  dockerfile: Dockerfile
  arch: amd64

env:
  clear:
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: 169.58.135.136,api.orion13.us
    CORS_ALLOWED_ORIGINS: https://kiu.orion13.us,http://169.58.135.136
    PUBLIC_API_URL: http://169.58.135.136
    REDIS_URL: redis://upanel-redis:6379/0
    CELERY_BROKER_URL: redis://upanel-redis:6379/1
    CELERY_RESULT_BACKEND: redis://upanel-redis:6379/2
  secret:
    - DJANGO_SECRET_KEY
    - DATABASE_URL
    - POSTGRES_PASSWORD
    - MAILJET_API_KEY
    - MAILJET_SECRET_KEY
    - ONESIGNAL_APP_ID
    - ONESIGNAL_REST_API_KEY
    - SENTRY_DSN

accessories:
  db:
    image: postgres:16-alpine
    host: 169.58.135.136
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: upanel
        POSTGRES_DB: upanel
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: 169.58.135.136
    port: "127.0.0.1:6379:6379"
    cmd: redis-server --appendonly yes
    directories:
      - data:/data

  nginx:
    image: nginx:1.27-alpine
    host: 169.58.135.136
    options:
      network: host
    files:
      - config/nginx/upanel.conf:/etc/nginx/conf.d/default.conf
