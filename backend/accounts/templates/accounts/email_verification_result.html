<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eef2f6; margin: 0; padding: 32px 16px; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px rgba(15,77,46,.12); }
    h1 { font-size: 1.35rem; margin: 0 0 12px; color: #111; }
    p { color: #444; line-height: 1.55; margin: 0 0 14px; }
    .ok { color: #177245; }
    .err { color: #b42318; }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      background: #177245;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .hint { font-size: 13px; color: #64748b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="{% if success %}ok{% else %}err{% endif %}">{{ title }}</h1>
    <p>{{ message }}</p>
    {% if success and return_url %}
    <a id="open-app" class="btn" href="{{ return_url }}">Open U-Panel</a>
    <p class="hint">Tap the button above to return to the app. If nothing happens, open U-Panel manually and tap <strong>I verified my email</strong>.</p>
    <script>
      (function () {
        var customUrl = "{{ return_url|escapejs }}";
        var pkg = "{{ android_package|escapejs }}";
        var link = document.getElementById("open-app");
        if (!link || !customUrl) return;
        var ua = navigator.userAgent || "";
        if (/Android/i.test(ua) && customUrl.indexOf("://") > 0) {
          var scheme = customUrl.split("://")[0];
          var rest = customUrl.split("://")[1] || "open/email-verified";
          link.href =
            "intent://" + rest +
            "#Intent;scheme=" + scheme +
            ";package=" + pkg +
            ";action=android.intent.action.VIEW" +
            ";category=android.intent.category.BROWSABLE" +
            ";category=android.intent.category.DEFAULT" +
            ";S.browser_fallback_url=" + encodeURIComponent(customUrl) +
            ";end";
        }
      })();
    </script>
    {% elif success %}
    <p>Return to the U-Panel app and tap <strong>I verified my email</strong> to continue.</p>
    {% endif %}
  </div>
</body>
</html>
