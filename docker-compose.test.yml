# Isolated test stack for Contabo (/opt/test).
# Does NOT bind host port 80 — production at /opt/upanel keeps that.
# Public URL: https://test.orion13.us
#   Prod nginx (Host: test.orion13.us) → Docker DNS upanel-test-nginx:80
#   via shared external network upanel-edge (not host.docker.internal).
# Prefer: bash scripts/contabo/deploy-test-on-server.sh
# Host port TEST_HTTP_PORT (default 8080; use 8085 if taken) is for direct IP
# access only — the hostname path does not depend on it:
#   TEST_HTTP_PORT=8085 bash scripts/contabo/deploy-test-on-server.sh
#
# Manual:
#   docker network create upanel-edge 2>/dev/null || true
#   cd /opt/test
#   docker compose -p upanel-test -f docker-compose.test.yml --env-file .env.test up -d --build
#
# Direct IP access: http://SERVER_IP:${TEST_HTTP_PORT}/

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: upanel_test
      POSTGRES_USER: upanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upanel -d upanel_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgres://upanel:${POSTGRES_PASSWORD}@db:5432/upanel_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A upanel worker -l info
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgres://upanel:${POSTGRES_PASSWORD}@db:5432/upanel_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A upanel beat -l info
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgres://upanel:${POSTGRES_PASSWORD}@db:5432/upanel_test
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: config/nginx/Dockerfile.test
    restart: unless-stopped
    # Direct IP / curl fallback only. Hostname traffic uses upanel-edge DNS.
    ports:
      - "${TEST_HTTP_PORT:-8080}:80"
    networks:
      default:
      upanel-edge:
        aliases:
          - upanel-test-nginx
    depends_on:
      - web

volumes:
  test_postgres_data:
  test_redis_data:

# Shared with docker-compose.prod.yml — create once:
#   docker network create upanel-edge
networks:
  upanel-edge:
    external: true
    name: upanel-edge
